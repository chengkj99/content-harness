[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "content-harness"
version = "0.3.1"
description = "Local-first, evidence-aware content workflow for Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["typer>=0.16,<1", "pydantic>=2.11,<3", "PyYAML>=6.0.2,<7"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
content-harness = "content_harness.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/content_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
